format="""
$os\
$directory\
$git_branch\
$git_status\

$fill\

$cmd_duration\
$time\
$line_break\

$character
"""

palette = "cat"

[os]
disabled = false
format = " [$symbol]($style) "
style = "bold mauve"

[directory]
truncation_length = 3
truncation_symbol = "@/"
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold peach"
read_only = ""

[git_branch]
symbol = " "
format = "[$symbol$branch]($style) "
style = "bold red"

[git_status]
format = "[$all_status$ahead_behind]($style) "
ahead = ""
style = "bold red"

[fill]
symbol = " "
style = "bold yellow"

[time]
disabled = false
format = " [ $time]($style)"
time_format = "%H:%M"
style = "bold lavender"

[cmd_duration]
format = " [$duration](bold flamingo) "

[line_break]
disabled = false

[character]
success_symbol = "[ λ ](bold blue)"
error_symbol = "[ λ ](bold red)"

[palettes.cat]
rosewater = "#f5e0dc"
